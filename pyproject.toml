[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "generate-star-grid"
version = "0.1.0"
description = "Tools for generating MESA stellar evolution grids on HPC clusters"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "tables",
]

[tool.setuptools.packages.find]
include = ["generate_star_grid*"]
